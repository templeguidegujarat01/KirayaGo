<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in or sign up | KirayaGo</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="common.skip">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main" class="wrap narrow">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-login" aria-selected="true" data-i18n="auth.login">Log in</button>
    <button role="tab" id="tab-signup" aria-selected="false" data-i18n="auth.signup">Create account</button>
  </div>
  <div id="msg" role="alert" aria-live="assertive"></div>

  <form id="login-form" class="form" novalidate>
    <label for="l-email" data-i18n="auth.email">Email</label><input id="l-email" type="email" autocomplete="email" required>
    <label for="l-pass" data-i18n="auth.password">Password</label><input id="l-pass" type="password" autocomplete="current-password" required>
    <button class="btn full big" type="submit" data-i18n="auth.login">Log in</button>
    <button type="button" class="linklike" id="forgot" data-i18n="auth.forgot">Forgot password?</button>
  </form>

  <form id="signup-form" class="form" hidden novalidate>
    <label for="s-name" data-i18n="auth.name">Your name</label><input id="s-name" autocomplete="name" required maxlength="80">
    <fieldset><legend data-i18n="auth.i_am">I am a</legend>
      <label class="check"><input type="radio" name="acct" value="owner" checked> <span data-i18n="opt.account_type.owner">Property owner</span></label>
      <label class="check"><input type="radio" name="acct" value="manager"> <span data-i18n="opt.account_type.manager">Property manager</span></label>
      <label class="check"><input type="radio" name="acct" value="broker"> <span data-i18n="opt.account_type.broker">Broker / agent</span></label></fieldset>
    <label for="s-email" data-i18n="auth.email">Email</label><input id="s-email" type="email" autocomplete="email" required>
    <label for="s-pass" data-i18n="auth.password">Password</label><input id="s-pass" type="password" autocomplete="new-password" minlength="8" required>
    <p class="hint" data-i18n="auth.pw_hint">At least 8 characters.</p>
    <button class="btn full big" type="submit" data-i18n="auth.signup">Create account</button>
  </form>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
