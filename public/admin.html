<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin | KirayaGo</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="common.skip">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main" class="wrap">
  <h1 data-i18n="admin.title">Admin</h1>
  <div id="denied" class="notice err" hidden data-i18n="admin.denied">You do not have access to this page.</div>
  <div id="admin-app" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-listings" aria-selected="true" data-i18n="admin.listings">Listings</button>
      <button role="tab" id="tab-reports" aria-selected="false" data-i18n="admin.reports">Reports</button>
      <button role="tab" id="tab-users" aria-selected="false" data-i18n="admin.users">Users</button>
    </div>
    <section id="panel-listings">
      <form id="lq" class="row2">
        <div><label class="sr" for="lq-text" data-i18n="admin.search">Search</label><input id="lq-text" type="search" data-i18n-ph="admin.search" placeholder="Search"></div>
        <div><label class="sr" for="lq-status" data-i18n="admin.all_status">All statuses</label><select id="lq-status"></select></div>
      </form>
      <div id="list-listings" class="mylist"></div>
      <p><button id="more-listings" class="btn ghost" hidden data-i18n="admin.load_more">Load more</button></p>
    </section>
    <section id="panel-reports" hidden><div id="list-reports" class="mylist"></div></section>
    <section id="panel-users" hidden>
      <form id="uq"><label class="sr" for="uq-text" data-i18n="admin.search">Search</label><input id="uq-text" type="search" placeholder="Email or name"></form>
      <div id="list-users" class="mylist"></div>
    </section>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
